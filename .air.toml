root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main"
  cmd = "templ generate && npx @tailwindcss/cli -i ./assets/css/input.css -o ./public/css_global.css && go build -o ./tmp/main ."
  delay = 100
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "docs", "sqlc", "node_modules", "files", "internal/sqlc"]
  exclude_file = ["assets/css/global.css"]
  exclude_regex = ["_test.go", ".*_templ.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "templ"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = true

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true

[proxy]
  app_port = 8080
  app_start_timeout = 5000
  enabled = true
  proxy_port = 8090
